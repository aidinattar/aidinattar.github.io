name: Deploy Franklin Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
    
      - name: Cache Julia environment
        uses: julia-actions/cache@v3

      - name: Instantiate project
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Test Pages CMS note pipeline
        run: PYTHONPATH=scripts python3 -m unittest discover -s scripts -p 'test_note_pipeline.py'

      # The note itself contains the canonical Julia figure code. Generate the
      # SVG before build_content.py checks image paths in the frontmatter/body.
      - name: Generate synaptic balancing SVG
        run: julia --project=. scripts/generate_synaptic_balance.jl

      - name: Generate pages from Pages CMS content
        run: python3 scripts/build_content.py

      - name: Build Franklin site
        run: julia --project=. -e 'using Franklin; optimize(clear=true)'

      - name: Normalize sitemap URLs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("__site/sitemap.xml")

          namespace = "http://www.sitemaps.org/schemas/sitemap/0.9"
          ET.register_namespace("", namespace)

          tree = ET.parse(path)
          root = tree.getroot()

          count = 0

          for loc in root.findall(f".//{{{namespace}}}loc"):
              if loc.text and loc.text.endswith("/index.html"):
                  loc.text = loc.text[:-len("index.html")]
                  count += 1

          tree.write(path, encoding="utf-8", xml_declaration=True)

          print(f"Normalized {count} sitemap URLs")
          PY

      - name: Verify generated note pages and images
        run: python3 scripts/check_site.py

      - name: Copy static verification and robots files
        run: |
          cp google4083dfcedcc5d554.html __site/google4083dfcedcc5d554.html
          cp robots.txt __site/robots.txt
          touch __site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./__site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
